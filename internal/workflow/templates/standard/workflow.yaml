name: "standard"
description: "The default USM workflow for implementation"
steps:
  - id: "01-laying-the-foundation"
    description: "Laying the Foundation"
    prompt: "prompts/01-laying-the-foundation.md"
    variables:
      goal: "Prepare the codebase to safely accommodate the upcoming changes"
  
  - id: "02-laying-the-foundation-testing"
    description: "Laying the Foundation Testing"
    prompt: "prompts/02-laying-the-foundation-testing.md"
    variables:
      goal: "Test the foundation to ensure it's solid"
  
  - id: "03-minimum-viable-implementation"
    description: "Minimum Viable Implementation (MVI)"
    prompt: "prompts/03-minimum-viable-implementation.md"
    variables:
      goal: "Implement the core functionality to meet the minimum viable requirements"
  
  - id: "04-minimum-viable-implementation-testing"
    description: "Minimum Viable Implementation Testing"
    prompt: "prompts/04-minimum-viable-implementation-testing.md"
    variables:
      goal: "Test the minimum viable implementation"
  
  - id: "05-extending-functionalities"
    description: "Extending Functionalities"
    prompt: "prompts/05-extending-functionalities.md"
    variables:
      goal: "Extend the implementation to support more scenarios and edge cases"
  
  - id: "06-extending-functionalities-testing"
    description: "Extending Functionalities Testing"
    prompt: "prompts/06-extending-functionalities-testing.md"
    variables:
      goal: "Test the extended functionalities"
  
  - id: "07-final-iteration"
    description: "Final Iteration"
    prompt: "prompts/07-final-iteration.md"
    variables:
      goal: "Refine and polish the implementation"
  
  - id: "08-final-iteration-testing"
    description: "Final Iteration Testing"
    prompt: "prompts/08-final-iteration-testing.md"
    variables:
      goal: "Final testing and validation of the implementation" 